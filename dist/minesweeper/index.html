<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080c17" />
    <meta name="description" content="手机端扫雷游戏，包含初级、中级和高级难度。" />
    <title>扫雷 · DON'T PANIC 42</title>
    <link rel="stylesheet" href="./mines.css" />
  </head>
  <body>
    <main class="mine-shell">
      <header>
        <a href="/" class="back-link">← 返回首页</a>
        <div class="title-row">
          <div>
            <p class="eyebrow">DON'T PANIC 42</p>
            <h1>扫雷</h1>
          </div>
          <p class="subtitle">避开地雷，清空所有安全格。</p>
        </div>
      </header>

      <nav class="difficulty-tabs" aria-label="难度选择">
        <button class="active" type="button" data-difficulty="beginner" aria-pressed="true">初级 <small>9×9 · 10雷</small></button>
        <button type="button" data-difficulty="intermediate" aria-pressed="false">中级 <small>16×16 · 40雷</small></button>
        <button type="button" data-difficulty="expert" aria-pressed="false">高级 <small>16×30 · 99雷</small></button>
      </nav>

      <section class="mine-panel" aria-label="扫雷游戏">
        <div class="dashboard">
          <div class="counter"><span>剩余地雷</span><strong id="mine-count">010</strong></div>
          <button id="reset-game" class="face-button" type="button" aria-label="重新开始">🙂</button>
          <div class="counter"><span>用时</span><strong id="timer">000</strong></div>
        </div>

        <div class="tool-row">
          <p id="game-status" aria-live="polite">点击任意格开始，首次点击一定安全</p>
          <button id="flag-mode" class="flag-button" type="button" aria-pressed="false">⚑ 插旗模式</button>
        </div>

        <div class="board-scroll" role="region" aria-label="可横向滚动的游戏区域" tabindex="0">
          <div id="mine-board" class="mine-board" role="grid" aria-label="扫雷棋盘"></div>
        </div>

        <div class="record-row">
          <span>当前难度最佳</span>
          <strong id="mine-best">暂无</strong>
        </div>
      </section>

      <footer>轻点翻开 · 长按插旗 · 高级棋盘可横向滑动</footer>
    </main>
    <script type="module" src="./mines.js"></script>
  </body>
</html>
