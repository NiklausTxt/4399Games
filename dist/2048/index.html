<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070b16" />
    <meta name="description" content="专为手机优化的 2048 数字合成游戏。滑动方块，挑战 2048。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b16'/%3E%3Cpath d='M11 31h14V12h14v19h14v14H39v7H25v-7H11z' fill='%236fffe9'/%3E%3C/svg%3E" />
    <title>2048 · DON'T PANIC 42</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">DON'T PANIC 42</p>
          <h1>2048</h1>
        </div>
        <div class="scoreboard" aria-label="游戏分数">
          <div class="score-card">
            <span>分数</span>
            <strong id="score">0</strong>
            <i id="score-add" aria-hidden="true"></i>
          </div>
          <div class="score-card">
            <span>最佳</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </header>

      <section class="account-bar" aria-label="账号状态">
        <div>
          <strong id="account-status">游客模式</strong>
          <small id="sync-status">登录后可跨设备保存成绩</small>
        </div>
        <div class="account-actions">
          <button id="account-action" class="secondary-action compact-action" type="button">登录 / 注册</button>
          <button id="logout" class="text-action" type="button" hidden>退出</button>
        </div>
      </section>

      <section class="game-panel" aria-labelledby="game-instruction">
        <div class="game-toolbar">
          <p id="game-instruction">滑动数字，让相同方块合并。</p>
          <button id="new-game" type="button">新游戏</button>
        </div>

        <div class="board-frame">
          <div id="board" class="board" role="application" aria-label="2048 游戏棋盘" aria-describedby="game-instruction"></div>
          <div id="game-message" class="game-message" hidden>
            <div class="message-card">
              <p class="message-kicker" id="message-kicker">本局结束</p>
              <h2 id="message-title">再来一次？</h2>
              <p id="message-copy">差一点就创造新纪录。</p>
              <div class="message-actions">
                <button id="keep-playing" class="secondary-action" type="button" hidden>继续挑战</button>
                <button id="try-again" type="button">重新开始</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer>
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 也可以操作</span>
        <span>合成 2048 即胜利</span>
      </footer>
    </main>

    <div id="auth-modal" class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title" hidden>
      <div class="auth-card">
        <button id="auth-close" class="icon-action" type="button" aria-label="关闭登录窗口">×</button>
        <p class="message-kicker">云端存档</p>
        <h2 id="auth-title">登录</h2>
        <div class="auth-tabs" role="tablist" aria-label="登录或注册">
          <button id="login-tab" class="auth-tab active" type="button" role="tab" aria-selected="true">登录</button>
          <button id="register-tab" class="auth-tab" type="button" role="tab" aria-selected="false">注册</button>
        </div>
        <form id="auth-form">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" minlength="3" maxlength="24" required />
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required />
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
          <button id="auth-submit" type="submit">登录并同步</button>
        </form>
        <p class="auth-note">密码经过安全派生后存储；登录为可选项，游客也能正常游戏。</p>
      </div>
    </div>

    <script type="module" src="../game.js"></script>
  </body>
</html>
